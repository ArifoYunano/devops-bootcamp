<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arif Yunan — DevOps Bootcamp 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f8fafc;
      --bg-card: linear-gradient(135deg, #ffffff, #f1f5f9);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #6366f1;
      --shadow: rgba(15, 23, 42, 0.15);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1rem;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .card {
      width: 340px;
      padding: 2rem 2rem 2.5rem;
      text-align: center;
      background: var(--bg-card);
      border-radius: 24px;
      box-shadow: 0 20px 40px var(--shadow);
      opacity: 0;
      animation: fade-in 1.2s ease forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 50px var(--shadow);
    }

    body.dark {
      --bg: #0f172a;
      --bg-card: linear-gradient(135deg, #1e293b, #0f172a);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    .toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: var(--bg-card);
      color: var(--text);
      box-shadow: 0 4px 12px var(--shadow);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #fff;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      animation: pulse 2s ease-in-out infinite;
    }

    .name {
      margin-top: 1.5rem;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .cohort {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: var(--muted);
    }

    .role {
      margin-top: 0.25rem;
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.5); }
      50%      { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
    }
  </style>
</head>
<body>
  <button class="toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
  <div class="card">
    <span class="badge">Student</span>
    <div class="name">Arif Yunan</div>
    <div class="cohort">DevOps Bootcamp 2026 · Cohort 1</div>
    <div class="role">DevOps Engineer</div>
  </div>
  <script>
    const toggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('theme');
    const apply = (dark) => {
      document.body.classList.toggle('dark', dark);
      toggle.textContent = dark ? '☀️' : '🌙';
    };
    apply(saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches));
    toggle.addEventListener('click', () => {
      const dark = !document.body.classList.contains('dark');
      apply(dark);
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
